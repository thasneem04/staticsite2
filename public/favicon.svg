<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Circle/Hexagon base -->
  <rect width="64" height="64" rx="14" fill="#ffffff" />
  
  <!-- ACS Hexagon Icon -->
  <g transform="translate(6, 6) scale(0.8125)">
    <!-- Outer Hexagon Frame -->
    <polygon points="32,2 60,18 60,46 32,62 4,46 4,18" 
             fill="none" 
             stroke="#0b4a36" 
             stroke-width="5" 
             stroke-linejoin="round" />
    
    <!-- Red Inner Triangle / 'A' shape -->
    <path d="M 32,12 L 17,40 L 47,40 Z" 
          fill="none" 
          stroke="#c11f24" 
          stroke-width="4.5" 
          stroke-linejoin="round" 
          stroke-linecap="round" />
    
    <!-- Middle Horizontal Bars / 'C' and 'S' structure -->
    <path d="M 12,48 L 52,48" 
          stroke="#0b4a36" 
          stroke-width="4.5" 
          stroke-linecap="round" />
          
    <path d="M 16,55 L 48,55" 
          stroke="#0b4a36" 
          stroke-width="3.5" 
          stroke-linecap="round" />
  </g>
</svg>